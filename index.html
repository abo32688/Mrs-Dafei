<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家书银行·成长存单生成器</title>
<style>
  :root{
    --paper:#f6efe2; --paper2:#fffaf2; --red:#a4262c; --red-deep:#7d1c20;
    --ink:#3a2c20; --gold:#c69a3f; --green:#4a6b45; --line:#d9c9a8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:16px; min-height:100vh;
    background:
      radial-gradient(circle at 20% 15%, #f3e3c9 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, #efe0c6 0%, transparent 50%),
      #ece0c8;
    font-family:"KaiTi","STKaiti","Songti SC","SimSun","WenQuanYi Micro Hei",serif;
    color:var(--ink);
  }
  .wrap{max-width:1100px;margin:0 auto;}
  header.title{
    text-align:center;margin-bottom:18px;position:relative;
  }
  header.title h1{
    font-size:44px;margin:0;color:var(--red-deep);letter-spacing:4px;
    text-shadow:1px 1px 0 #e6d3aa;
  }
  header.title .sub{font-size:20px;color:var(--gold);letter-spacing:6px;margin-top:6px;}
  header.title .school{font-size:16px;color:#8a7550;margin-top:8px;letter-spacing:2px;}
  header.title .seal{
    position:absolute;right:8px;top:6px;width:74px;height:74px;border:3px solid var(--red);
    border-radius:50%;color:var(--red);font-size:16px;line-height:1.3;
    display:flex;align-items:center;justify-content:center;text-align:center;
    transform:rotate(-12deg);opacity:.85;
  }

  /* 导航 */
  nav.steps{
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 22px;
  }
  nav.steps button{
    font-family:inherit;font-size:22px;padding:12px 26px;border-radius:10px;cursor:pointer;
    border:2px solid var(--line);background:var(--paper2);color:var(--ink);
    transition:.15s;
  }
  nav.steps button:hover{background:#fff;}
  nav.steps button.active{
    background:var(--red);color:#fff;border-color:var(--red-deep);box-shadow:0 3px 8px rgba(125,28,32,.3);
  }
  nav.steps button .dot{
    display:inline-block;width:26px;height:26px;line-height:26px;border-radius:50%;
    background:var(--gold);color:#fff;font-size:16px;margin-right:8px;
  }
  nav.steps button.active .dot{background:#fff;color:var(--red);}

  .panel{
    display:none;background:var(--paper2);border:1px solid var(--line);
    border-radius:14px;padding:26px;box-shadow:0 4px 14px rgba(90,60,30,.08);
  }
  .panel.show{display:block;}
  .panel h2{font-size:28px;color:var(--red-deep);margin:0 0 6px;border-left:8px solid var(--red);padding-left:14px;}
  .panel .hint{font-size:17px;color:#8a7550;margin:0 0 20px 22px;}

  label{font-size:20px;display:block;margin:14px 0 8px;color:var(--ink);}
  input[type=text],textarea,select{
    font-family:inherit;font-size:20px;width:100%;padding:12px 14px;border:2px solid var(--line);
    border-radius:10px;background:#fffdf8;color:var(--ink);
  }
  textarea{min-height:100px;resize:vertical;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);}

  .btn{
    font-family:inherit;font-size:22px;padding:12px 30px;border-radius:10px;cursor:pointer;
    border:none;background:var(--red);color:#fff;margin:18px 12px 0 0;letter-spacing:2px;
  }
  .btn:hover{background:var(--red-deep);}
  .btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line);}
  .btn.gold{background:var(--gold);}

  /* 存单 */
  .deposit{
    max-width:640px;margin:10px auto;background:
      repeating-linear-gradient(0deg,transparent,transparent 30px,#e7d8b8 31px),
      var(--paper);
    border:2px solid var(--red);border-radius:14px;padding:26px 30px;position:relative;
  }
  .deposit::before,.deposit::after{
    content:"";position:absolute;top:0;bottom:0;width:14px;
    background:radial-gradient(circle,var(--paper2) 40%,transparent 42%) 0 0/14px 22px;
  }
  .deposit::before{left:-2px;}
  .deposit::after{right:-2px;transform:scaleX(-1);}
  .deposit .d-head{text-align:center;border-bottom:2px dashed var(--red);padding-bottom:10px;margin-bottom:16px;}
  .deposit .d-head b{font-size:30px;color:var(--red-deep);letter-spacing:3px;}
  .deposit .d-row{display:flex;font-size:22px;padding:8px 0;border-bottom:1px dotted #cbb88c;}
  .deposit .d-row .k{width:140px;color:#7a6540;flex:none;}
  .deposit .d-row .v{flex:1;color:var(--ink);}
  .deposit .stamp{
    position:absolute;right:34px;bottom:26px;width:96px;height:96px;border:4px solid var(--red);
    border-radius:50%;color:var(--red);font-size:20px;display:flex;align-items:center;
    justify-content:center;text-align:center;transform:rotate(-18deg);opacity:.75;line-height:1.2;
  }
  .no-data{text-align:center;color:#a08a5e;font-size:20px;padding:30px;}

  /* 家书 */
  .letter{
    max-width:720px;margin:10px auto;background:#fffdf6;padding:40px 46px;
    border:1px solid var(--line);box-shadow:0 0 0 10px #fffdf6, 0 0 0 11px var(--line);
    font-size:22px;line-height:2.1;
  }
  .letter .to{font-size:24px;color:var(--red-deep);}
  .letter .sign{text-align:right;color:#7a6540;margin-top:24px;}
  .tone{display:flex;gap:12px;margin:14px 0;}
  .tone span{font-size:18px;}

  /* 总账 */
  table.ledger{width:100%;border-collapse:collapse;font-size:18px;background:#fffdf8;}
  table.ledger th,table.ledger td{border:1px solid var(--line);padding:10px 12px;text-align:center;}
  table.ledger th{background:var(--red);color:#fff;font-size:19px;}
  .coin{font-weight:bold;}
  .c-listen{color:#3a6ea5;}
  .c-act{color:var(--green);}
  .c-warm{color:var(--red);}

  .counter{text-align:center;font-size:17px;color:#8a7550;margin-top:20px;letter-spacing:1px;}
  .center{text-align:center;}
  @media (max-width:600px){
    header.title h1{font-size:32px;}
    .deposit .d-row{flex-direction:column;font-size:20px;}
    .deposit .d-row .k{width:auto;}
    .btn{width:100%;margin:12px 0 0;}
  }
  @media print{
    body{background:#fff;padding:0;}
    nav.steps,.counter,.btn{display:none !important;}
    .panel{display:block !important;box-shadow:none;border:none;padding:0;}
    .deposit{box-shadow:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="title">
    <div class="seal">亲情<br>家书</div>
    <h1>家书银行</h1>
    <div class="sub">成 长 存 单 生 成 器</div>
    <div class="school">义乌市绣湖小学 · 叶月飞</div>
  </header>

  <nav class="steps">
    <button class="active" data-p="p1"><span class="dot">一</span>存入台</button>
    <button data-p="p2"><span class="dot">二</span>家书生成</button>
    <button data-p="p3"><span class="dot">三</span>利息诗</button>
    <button data-p="p4"><span class="dot">四</span>总账墙</button>
  </nav>

  <!-- 一、存入台 -->
  <section class="panel show" id="p1">
    <h2>存入台</h2>
    <p class="hint">把为家做的一件小事、听爸妈说的一句话，存成一笔成长。</p>
    <label>你的名字</label>
    <input type="text" id="inName" placeholder="可填昵称或学号，如：小语">
    <label>成长行为（情感币类型）</label>
    <select id="inType">
      <option value="listen">倾听币 · 倾听父母</option>
      <option value="act">行动币 · 为家做事</option>
      <option value="warm">暖心币 · 暖心表达</option>
    </select>
    <label>这件成长的事（简单写几句）</label>
    <textarea id="inText" placeholder="例：今天我帮妈妈摘菜，她讲起小时候挑水要走二里路……"></textarea>
    <div class="center">
      <button class="btn" onclick="saveDeposit()">存入 · 生成存单</button>
      <button class="btn ghost" onclick="document.getElementById('inText').value=''">清空重写</button>
    </div>
    <div id="depositBox"></div>
  </section>

  <!-- 二、家书生成 -->
  <section class="panel" id="p2">
    <h2>家书生成</h2>
    <p class="hint">选一句最近存下的成长，把它写成给爸妈的一封短家书。</p>
    <label>选择要写信的成长存单</label>
    <select id="letterSelect"></select>
    <div class="tone">
      <label style="margin:0 16px 0 0;font-size:20px;">口吻</label>
      <span><input type="radio" name="tone" value="warm" checked> 温暖</span>
      <span><input type="radio" name="tone" value="live"> 活泼</span>
      <span><input type="radio" name="tone" value="serious"> 认真</span>
    </div>
    <div class="center">
      <button class="btn" onclick="genLetter()">生成家书</button>
      <button class="btn gold" onclick="window.print()">打印这封家书</button>
    </div>
    <div id="letterBox"></div>
  </section>

  <!-- 三、利息诗 -->
  <section class="panel" id="p3">
    <h2>利息诗</h2>
    <p class="hint">把存下的成长，酿成一句一行诗。</p>
    <label>选择存单</label>
    <select id="poemSelect"></select>
    <div class="center">
      <button class="btn" onclick="genPoem()">抽取一行诗</button>
      <button class="btn gold" onclick="genPoem(true)">换一句试试</button>
    </div>
    <div id="poemBox"></div>
  </section>

  <!-- 四、总账墙 -->
  <section class="panel" id="p4">
    <h2>班级家书银行 · 总账墙</h2>
    <p class="hint">全班成长存单汇总，可投屏、可打印。</p>
    <div class="center">
      <button class="btn" onclick="renderLedger()">刷新总账</button>
      <button class="btn gold" onclick="window.print()">打印总账</button>
    </div>
    <div id="ledgerBox"></div>
  </section>

  <div class="counter" id="counter"></div>
</div>

<script>
/* ============ 存单存取（localStorage） ============ */
const KEY="jiashu_bank_v1";
let deposits=[];
function load(){try{deposits=JSON.parse(localStorage.getItem(KEY))||[];}catch(e){deposits=[];}}
function save(){localStorage.setItem(KEY,JSON.stringify(deposits));}

const TYPE={
  listen:{name:"倾听币",cls:"c-listen",word:["听","听","倾听"],icon:"👂"},
  act:{name:"行动币",cls:"c-act",word:["做","做","行动"],icon:"🌱"},
  warm:{name:"暖心币",cls:"c-warm",word:["暖","暖","暖意"],icon:"💗"}
};
function coinWord(t){return TYPE[t].word[Math.floor(Math.random()*3)];}

function todayStr(){
  const d=new Date();
  return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日";
}
function pad(n,len=4){return String(n).padStart(len,"0");}

function saveDeposit(){
  const name=document.getElementById("inName").value.trim()||"一位同学";
  const type=document.getElementById("inType").value;
  const text=document.getElementById("inText").value.trim();
  if(!text){alert("请先写下一句你的成长吧～");return;}
  const id=Date.now();
  const d={
    id,name,type,text,
    date:todayStr(),
    no:"JS-"+pad(Math.floor(Math.random()*9000+1000)),
    amount:1+Math.floor(Math.random()*3), // 1~3 情感币
    poem:""
  };
  deposits.unshift(d);
  save();
  renderDeposit(d);
  refreshSelects();
  document.getElementById("inText").value="";
  alert("存好了！这笔记入第 "+deposits.length+" 笔成长。");
}

function renderDeposit(d){
  const t=TYPE[d.type];
  document.getElementById("depositBox").innerHTML=`
    <div class="deposit">
      <div class="d-head"><b>成 长 存 单</b></div>
      <div class="d-row"><div class="k">存单编号</div><div class="v">${d.no}</div></div>
      <div class="d-row"><div class="k">存款人</div><div class="v">${d.name}</div></div>
      <div class="d-row"><div class="k">存入日期</div><div class="v">${d.date}</div></div>
      <div class="d-row"><div class="k">情感币</div><div class="v"><span class="coin ${t.cls}">${t.icon} ${t.name} × ${d.amount}</span>（${coinWord(d.type)}）</div></div>
      <div class="d-row"><div class="k">成长记录</div><div class="v">${esc(d.text)}</div></div>
      <div class="stamp">已存入<br>家书银行</div>
    </div>`;
}

function esc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}

function refreshSelects(){
  load();
  const opts=deposits.length
    ? deposits.map((d,i)=>`<option value="${d.id}">${d.date} · ${d.name} · ${TYPE[d.type].name}（${short(d.text)}）</option>`).join("")
    : `<option value="">还没有存单，先去「存入台」存一笔吧</option>`;
  document.getElementById("letterSelect").innerHTML=opts;
  document.getElementById("poemSelect").innerHTML=opts;
}
function short(s){return s.length>18?s.slice(0,18)+"…":s;}

/* ============ 家书生成 ============ */
const OPEN={
  warm:["亲爱的","亲爱的爸爸、妈妈：","亲爱的家人："],
  live:["嗨，老爸老妈！","亲爱的爸妈，你们好呀！","我最爱的爸妈："],
  serious:["亲爱的爸爸、妈妈：","敬爱的父母：","亲爱的家人："]
};
const END={
  warm:["爱你们的","永远想念你们的","一直爱你们的"],
  live:["你们的调皮小孩","你们的开心果","永远爱你们的"],
  serious:["此致 敬礼","你们的女儿/儿子","敬上"]
};
function genLetter(){
  const id=+document.getElementById("letterSelect").value;
  const tone=document.querySelector('input[name=tone]:checked').value;
  const d=deposits.find(x=>x.id===id);
  if(!d){document.getElementById("letterBox").innerHTML='<p class="no-data">请先存入一笔成长。</p>';return;}
  const t=TYPE[d.type];
  const open=pick(OPEN[tone]), end=pick(END[tone]);
  let body="";
  if(d.type==="listen"){
    body=`今天我想和你们说说心里话。${pickFeeling(d.text)}我忽然明白，你们讲过的那些往事、叮嘱过的那些话，都是一点点攒起来的爱。谢谢你们愿意讲给我听，也谢谢你们一直陪着我长大。`;
  }else if(d.type==="act"){
    body=`今天我试着为这个家做了一点小事——${pickDo(d.text)}。原来把一件小事认真做完，心里会这么踏实。以后我想多为家里分担一些，让你们能轻松一点、开心一点。`;
  }else{
    body=`今天有一句话特别想对你们说：${pickWarm(d.text)}。你们辛苦了。我很想用我的方式，让你们知道——你们在我心里，一直都很重要。`;
  }
  document.getElementById("letterBox").innerHTML=`
    <div class="letter">
      <div class="to">${open}</div>
      <div style="margin-top:18px;">${body}</div>
      <div class="sign">${end}<br>${d.name}<br>${d.date}</div>
    </div>`;
}
function pickFeeling(t){return pick(["听你们说话的时候，","想起这些的时候，","把这些记下来的时候，"]);}
function pickDo(t){return t.length>30?t.slice(0,30)+"…":t;}
function pickWarm(t){return t.length>26?t.slice(0,26)+"…":t;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}

/* ============ 利息诗 ============ */
const POEM={
  listen:[
    "你讲的那一年，我记在心里","一句叮咛，是长长的路","听见了，风就有了名字",
    "你的故事，落进我的纸里","听你说话，像摸到了旧时光","把你的话折好，藏进书包"
  ],
  act:[
    "一双小手，也能撑起一角家","做完的那一刻，我长高了一点","把家里的小事，做成了大事",
    "劳动的手，会开出花","今天的家，因我而更暖","一点一滴，都是成长的利息"
  ],
  warm:[
    "爱说出口，就有了光","一句想你，抵过千言万语","我的暖，寄给远方的你",
    "把想念折成纸船，漂回家","你笑起来，全世界都亮了","小小的一句，重重的爱"
  ]
};
function genPoem(regen=false){
  const id=+document.getElementById("poemSelect").value;
  const d=deposits.find(x=>x.id===id);
  if(!d){document.getElementById("poemBox").innerHTML='<p class="no-data">请先存入一笔成长。</p>';return;}
  let line=pick(POEM[d.type]);
  if(regen && d.poem && d.poem!==line){line=pick(POEM[d.type].filter(x=>x!==d.poem));}
  d.poem=line;save();
  const t=TYPE[d.type];
  document.getElementById("poemBox").innerHTML=`
    <div class="letter" style="text-align:center;font-size:30px;line-height:2.4;">
      <div style="font-size:18px;color:#8a7550;">${d.date} · ${d.name} 的成长利息</div>
      <div style="margin-top:20px;color:var(--red-deep);">${line}</div>
      <div style="font-size:16px;color:#a08a5e;margin-top:24px;">—— ${t.icon} ${t.name} · 家书银行</div>
    </div>`;
}

/* ============ 总账墙 ============ */
function renderLedger(){
  load();
  const box=document.getElementById("ledgerBox");
  if(!deposits.length){box.innerHTML='<p class="no-data">班级家书银行还没有存单，快去存入台存第一笔吧。</p>';return;}
  let l=a=n=w=0;
  const rows=deposits.map(d=>{
    const t=TYPE[d.type];
    if(d.type==="listen")l+=d.amount; if(d.type==="act")a+=d.amount; if(d.type==="warm")w+=d.amount;
    return `<tr><td>${d.date}</td><td>${d.no}</td><td>${d.name}</td>
      <td class="coin ${t.cls}">${t.icon} ${t.name}</td>
      <td>${d.amount}</td><td style="text-align:left;">${esc(short(d.text))}</td></tr>`;
  }).join("");
  const total=l+a+w;
  box.innerHTML=`
    <table class="ledger">
      <thead><tr><th>日期</th><th>存单号</th><th>存款人</th><th>情感币</th><th>数量</th><th>成长记录</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="display:flex;justify-content:space-around;flex-wrap:wrap;margin-top:22px;font-size:22px;">
      <div class="coin c-listen">👂 倾听币合计：${l}</div>
      <div class="coin c-act">🌱 行动币合计：${a}</div>
      <div class="coin c-warm">💗 暖心币合计：${w}</div>
      <div class="coin" style="color:var(--red-deep);">💰 情感币总计：${total}</div>
    </div>
    <p class="center" style="font-size:20px;color:#7a6540;margin-top:18px;">
      本班已存入 <b style="color:var(--red);font-size:26px;">${deposits.length}</b> 笔成长 · 成长，有迹可循
    </p>`;
}

/* ============ 导航 ============ */
document.querySelectorAll('nav.steps button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('nav.steps button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
    document.getElementById(b.dataset.p).classList.add('show');
    if(b.dataset.p==="p4")renderLedger();
    if(b.dataset.p==="p2")refreshSelects();
  };
});

/* ============ 使用量统计 ============ */
(function counter(){
  let n=+(localStorage.getItem("jiashu_visits")||0)+1;
  localStorage.setItem("jiashu_visits",n);
  // 简单上报：若部署方提供接口，可取消下行注释并填入上报地址
  // fetch("https://你的上报地址/report",{method:"POST",body:JSON.stringify({page:"家书银行",n}),headers:{"Content-Type":"application/json"}}).catch(()=>{});
  document.getElementById("counter").textContent="家书银行累计到访："+n+" 次（本机统计）";
})();

load();refreshSelects();
if(deposits.length)renderDeposit(deposits[0]);
</script>
</body>
</html>
